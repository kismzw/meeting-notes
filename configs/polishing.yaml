model: qwen3:8b
ollama_url: http://127.0.0.1:11434/api/generate


scoring_weights:
  phonetic: 0.40
  topic: 0.20
  context: 0.20
  entity_consistency: 0.10
  source: 0.10

local_glossary_terms: []

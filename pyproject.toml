[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-notes"
version = "0.1.0"
description = "Local-first meeting transcription MVP"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "reportlab>=4.2.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
]

[project.optional-dependencies]
vad = ["silero-vad>=5.1"]
asr = ["faster-whisper>=1.1.0"]
asr-mlx = ["mlx-whisper>=0.4.3"]
diarization = ["pyannote.audio>=3.3"]

[tool.setuptools.packages.find]
include = ["application*", "backends*", "domain*", "infrastructure*", "ports*", "meeting_notes*"]
exclude = ["tests*", "configs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
